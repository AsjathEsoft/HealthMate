# HealthMate Java Spring Boot Backend Configuration
spring.application.name=healthmate-backend

# Listen on all interfaces on port 8085 (8080 is reserved on this machine, 8081 is Expo Metro)
server.address=0.0.0.0
server.port=${PORT:8085}

# Path to the existing SQLite database file (resolved relative to backend/ or workspace root)
healthmate.db.path=../health_records.db
